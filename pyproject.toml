[project]
name = "slicer-mcp"
version = "0.1.0"
description = "AI assistant plugin for automatic 3D/5D preparation in STE Slicer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ste_plugin/AIAssistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]
