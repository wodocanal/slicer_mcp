[project]
name = "slicer-mcp"
version = "0.1.0"
description = "Extensible local MCP server for FDM slicers, starting with OrcaSlicer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26,<2",
    "numpy>=2,<3",
    "pillow>=12,<13",
    "pydantic>=2.11,<3",
    "trimesh>=4.10,<5",
]

[project.scripts]
slicer-mcp = "slicer_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ste_plugin/AIAssistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]
