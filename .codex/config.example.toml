# Generate .codex/config.toml with: uv run python scripts/configure_codex.py
# Project configuration is loaded only for trusted projects.
[mcp_servers.slicer]
command = "/absolute/path/to/slicer_mcp/.venv/bin/python"
args = ["-m", "slicer_mcp.server"]
cwd = "/absolute/path/to/slicer_mcp"
startup_timeout_sec = 30
tool_timeout_sec = 240
enabled = true

[mcp_servers.slicer.env]
SLICER_MCP_WORKSPACE = "/absolute/path/to/slicer_mcp/.slicer-mcp"
# ORCASLICER_BIN = "/Applications/OrcaSlicer.app/Contents/MacOS/OrcaSlicer"
# ORCASLICER_PROFILES_DIR = "/path/to/OrcaSlicer/resources/profiles"
# ORCASLICER_USER_DIR = "/path/to/OrcaSlicer/user"
